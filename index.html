<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đảo Đèn Lồng</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #0a1220; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      font-family: system-ui, sans-serif; color: #e8f4ff;
      background: rgba(10, 18, 32, 0.72); border: 1px solid #24405e;
      border-radius: 10px; padding: 10px 14px; font-size: 14px; line-height: 1.6;
      min-width: 220px;
    }
    #hud b { color: #ffd977; }
    #hint {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
      font-family: system-ui, sans-serif; color: #9db8d4; font-size: 13px;
      background: rgba(10, 18, 32, 0.6); border-radius: 8px; padding: 6px 14px;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="hud">
    <div>Đom đóm: <b id="hud-fireflies">0</b></div>
    <div>Đèn lồng thắp: <b id="hud-lanterns">0/0</b></div>
    <div>Thời gian: <b id="hud-time">0s</b></div>
  </div>
  <div id="hint">WASD / phím mũi tên: di chuyển · Shift: chạy nhanh · E: thắp đèn</div>
  <script type="module" src="./src/view/main.js"></script>
</body>
</html>
